[package]
name        = "sixcy"
version     = "2.0.0"
edition     = "2021"
authors     = ["Cyh"]
description = "Reference implementation of the .6cy container format — with CDC, Merkle proofs, and Reed–Solomon FEC"
license     = "Apache-2.0"
repository  = "https://github.com/cyh/sixcy"
keywords    = ["compression", "archive", "fec", "reed-solomon", "content-defined-chunking"]
categories  = ["compression", "encoding", "command-line-utilities"]

[lints.clippy]
# Allow stylistic issues that don't affect correctness
large_enum_variant = "allow"
too_many_arguments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
while_let_loop = "allow"
io_other_error = "allow"
clone_on_copy = "allow"
needless_borrows_for_generic_args = "allow"
new_without_default = "allow"
implicit_saturating_sub = "allow"
needless_range_loop = "allow"

[dependencies]
thiserror  = "1.0"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd       = "0.13"
lz4_flex   = "0.11"
brotli     = "3.4"
lzma-rs    = "0.3"
aes-gcm    = { version = "0.10", features = ["getrandom"] }
argon2     = "0.5"
crc32fast  = "1.3"
uuid       = { version = "1.6", features = ["v4"] }
clap       = { version = "4.4", features = ["derive"] }
byteorder  = "1.5"
chrono     = "0.4"
blake3     = "1.5"
hex        = "0.4"
rayon      = { version = "1.8", optional = true }
rand       = "0.8"
rand_chacha = "0.3"

[features]
parallel = ["dep:rayon"]

[dev-dependencies]
proptest   = "1.4"
criterion  = "0.5"
tempfile   = "3.8"

[[bin]]
name = "6cy"
path = "src/main.rs"

[[bench]]
name    = "compression_bench"
harness = false
